
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>TontineChain | Gestion complète</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo"><i class="fas fa-link"></i> Tontine<span style="color:#e67e22;">Chain</span></div>
        <div><button id="connectWalletBtn" class="btn-sm" style="background:#1e8f5e; color:white;"><i class="fas fa-wallet"></i> Connect Wallet</button></div>
    </div>

    <div id="mainDashboard" class="dashboard">
        <!-- CARTE CRÉATION AVEC CHECKLIST MEMBRES -->
        <div id="creationCard" class="card">
            <div class="card-header"><h2><i class="fas fa-plus-circle"></i> Créer une tontine</h2></div>
            <div class="card-body">
                <div class="form-group"><label>Nom de la tontine</label><input type="text" id="tontineName" value="Tontine des Amazones"></div>
                <div class="form-group"><label><i class="fas fa-users"></i> Participants (cochez les membres)</label>
                    <div id="membersChecklist" class="members-selector"></div>
                    <button id="openAddMemberModalBtn" class="btn-sm btn-outline-green" style="margin-top:8px;"><i class="fas fa-user-plus"></i> Nouveau membre</button>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Montant (FCFA)</label><input type="number" id="montant" value="10000" step="1000"></div>
                    <div class="form-group"><label>Fréquence</label><select id="frequence"><option>Mensuelle</option><option>Hebdomadaire</option></select></div>
                </div>
                <div class="form-group"><label>Date de début</label><input type="date" id="dateDebut" value="2026-06-01"></div>
                <div class="form-group"><label>Ordre bénéficiaires</label><select id="ordre"><option>Aléatoire</option><option>Fixe</option></select></div>
                <div class="form-group"><label>Pénalité retard (%)</label><input type="number" id="penalite" value="5" step="1"></div>
                <div class="info-highlight">
                    <div><span class="info-label">Total cagnotte</span><div class="info-value" id="totalPreview">0 FCFA</div></div>
                    <div><span class="info-label">Durée</span><div class="info-value" id="dureePreview">0 cycles</div></div>
                </div>
                <div class="text-muted" style="text-align:center; margin:12px 0;"><i class="fas fa-link"></i> Sécurisé par blockchain</div>
                <button id="createTontineBtn" class="btn-primary"><i class="fas fa-cube"></i> Créer la tontine</button>
            </div>
        </div>

        <!-- CARTE LISTE -->
        <div id="listingCard" class="card">
            <div class="card-header flex-between"><h2><i class="fas fa-shapes"></i> Vos Tontines</h2><div id="tontineCount" class="text-muted">0 tontine</div></div>
            <div class="card-body"><div id="tontinesList"></div></div>
        </div>
    </div>

    <!-- SECTION DÉTAILS -->
    <div id="tontineDetailsSection" class="card" style="display: none; margin-top: 32px;">
        <div class="card-header flex-between"><h2 id="detailTitle">Détail</h2><button onclick="closeTontineDetails()" class="btn-sm" style="background:#fdeaea; color:#c0392b;">Fermer</button></div>
        <div class="card-body">
            <div class="stats-banner">
                <div style="font-size:0.8rem;">Cagnotte actuelle</div>
                <div class="cagnotte-amount" id="cagnotteAmount">0 FCFA</div>
                <div id="roundInfoDetail" style="margin-top:8px;"></div>
            </div>
            <div style="display:grid; grid-template-columns:1fr 260px; gap:24px;">
                <div>
                    <h3><i class="fas fa-users"></i> État des paiements</h3>
                    <div id="roundPaymentsList" style="display:grid; gap:12px; margin-top:16px;"></div>
                    <div style="margin-top:24px;"><h3>Journal</h3><div id="eventLogs" style="background:#2c3e50; color:#ecf0f1; padding:12px; border-radius:20px; font-size:0.7rem; max-height:120px; overflow-y:auto;"></div></div>
                </div>
                <div>
                    <div style="text-align:center;"><canvas id="progressChart" style="max-width:180px; margin:0 auto;"></canvas><div id="cagnotteProgress" class="text-muted" style="margin-top:8px;"></div></div>
                    <div id="releaseSection" style="display:none; margin-top:20px;"><button id="releaseFundsBtn" class="btn-primary" style="background:#f1c40f; color:#7d6608;">LIBÉRER LES FONDS</button></div>
                    <div style="margin-top:24px;"><h4>Archives</h4><div id="archivedRounds"></div></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- MODAL AJOUT MEMBRE -->
<div id="memberModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); align-items:center; justify-content:center; z-index:1000;">
    <div style="background:white; max-width:400px; width:90%; border-radius:40px; padding:24px;">
        <h3><i class="fas fa-user-plus"></i> Nouveau membre</h3>
        <input type="text" id="newMemberName" placeholder="Nom complet" style="width:100%; margin:16px 0; padding:12px; border-radius:40px;">
        <div style="display:flex; gap:12px; justify-content:flex-end;">
            <button id="closeModalBtn" class="btn-sm">Annuler</button>
            <button id="confirmAddMemberBtn" class="btn-primary" style="width:auto;">Ajouter</button>
        </div>
    </div>
</div>

<script src="./app.js"></script>
</body>
</html>
