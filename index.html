<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>TontineChain | Création tontine & règles 🔗</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo"><i class="fas fa-link"></i> Tontine<span style="color:#e67e22;">Chain</span></div>
        <div class="badge"><i class="fas fa-database"></i> Base membres intégrée · Règles immuables</div>
    </div>

    <div class="dashboard">
        <!-- COLONNE GAUCHE : Création tontine + règles -->
        <div class="card">
            <div class="card-header">
                <h2><i class="fas fa-plus-circle"></i> Créer une tontine</h2>
                <p class="text-muted" style="margin-top: 6px;">Définissez les règles. Les participants sont liés à la plateforme.</p>
            </div>
            <div class="card-body">
                <div class="form-group">
                    <label><i class="fas fa-tag"></i> Nom de la tontine</label>
                    <input type="text" id="tontineName" placeholder="ex: Tontine Épargne Digitale" value="Tontine Bénin 2026">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-coins"></i> Montant par tour (FCFA)</label>
                    <input type="number" id="montant" value="10000" step="1000">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-calendar-week"></i> Fréquence</label>
                    <select id="frequence">
                        <option value="hebdomadaire">Hebdomadaire</option>
                        <option value="mensuelle" selected>Mensuelle</option>
                        <option value="bimensuelle">Bimensuelle</option>
                    </select>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-users"></i> Participants (depuis la base)</label>
                    <div id="membersChecklist" class="members-selector">
                        <!-- Listes chargées dynamiquement depuis la base -->
                    </div>
                    <button type="button" id="openAddMemberModalBtn" class="btn-sm btn-outline-green" style="margin-top: 8px;"><i class="fas fa-user-plus"></i> Ajouter un nouveau membre</button>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-sort-amount-down"></i> Ordre des bénéficiaires</label>
                    <select id="ordreTirage">
                        <option value="fixe">Ordre fixe (selon l'ordre sélectionné ci-dessus)</option>
                        <option value="aleatoire">Aléatoire (déterminé à la création)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-hourglass-half"></i> Délai de paiement (jours)</label>
                    <select id="delaiPaiement">
                        <option value="3">3 jours</option>
                        <option value="5" selected>5 jours</option>
                        <option value="7">7 jours</option>
                    </select>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-gavel"></i> Pénalité (non-paiement / retard)</label>
                    <select id="penalite">
                        <option value="exclusion">Exclure le membre défaillant</option>
                        <option value="amende">Amende 5% reversée au groupe</option>
                        <option value="blocage">Blocage du cycle jusqu'à régularisation</option>
                    </select>
                </div>

                <div class="form-summary">
                    <div class="summary-item">
                        <label><i class="fas fa-wallet"></i> Total cagnotte estimé</label>
                        <div class="summary-value" id="totalCagnotteDisplay">0 FCFA</div>
                    </div>
                    <div class="summary-item">
                        <label><i class="fas fa-hourglass-end"></i> Durée de la tontine</label>
                        <div class="summary-value" id="dureeDisplay">0 cycles</div>
                    </div>
                </div>

                <button id="createTontineBtn" class="btn-primary"><i class="fas fa-cube"></i> Déployer le smart contract</button>
                <div id="createFeedback" style="margin-top: 16px;"></div>
            </div>
        </div>

        <!-- COLONNE DROITE : Liste des tontines existantes + base membres -->
        <div class="card">
            <div class="card-header">
                <h2><i class="fas fa-list-ul"></i> Tontines & membres</h2>
            </div>
            <div class="card-body">
                <div style="margin-bottom: 20px;">
                    <div class="flex-between">
                        <h3 style="font-size: 1rem;"><i class="fas fa-users"></i> Membres de la plateforme</h3>
                        <button id="quickAddMember" class="btn-sm" style="background:#eaf5ee;"><i class="fas fa-plus"></i> Ajouter</button>
                    </div>
                    <div id="membersList" style="margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px;"></div>
                </div>
                <hr>
                <h3 style="font-size: 1rem; margin-bottom: 12px;"><i class="fas fa-handshake"></i> Tontines enregistrées</h3>
                <div id="tontinesList" style="max-height: 380px; overflow-y: auto;"></div>
            </div>
        </div>
    </div>
</div>

<!-- Modal simplifié pour ajouter un membre -->
<div id="memberModal" style="display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.4); align-items: center; justify-content: center; z-index: 1000;">
    <div style="background: white; max-width: 400px; margin: auto; border-radius: 48px; padding: 28px; animation: fadeIn 0.2s;">
        <h3><i class="fas fa-user-plus"></i> Nouveau membre</h3>
        <input type="text" id="newMemberName" placeholder="Nom complet" style="margin: 16px 0; width:100%;">
        <input type="email" id="newMemberEmail" placeholder="Email (optionnel)" style="margin-bottom: 16px; width:100%;">
        <div style="display: flex; gap:12px; justify-content: flex-end;">
            <button id="closeModalBtn" class="btn-sm">Annuler</button>
            <button id="confirmAddMemberBtn" class="btn-primary" style="width: auto;">Ajouter</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
```
